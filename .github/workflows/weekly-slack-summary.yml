name: Weekly Slack summary

on:
  schedule:
    # Every Monday at 07:00 Europe/Zurich
    - cron: "0 7 * * 1"
      timezone: "Europe/Zurich"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  weekly-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19'

      - name: Install pi
        run: npm install -g @earendil-works/pi-coding-agent@0.80.6

      - name: Smoke test
        run: |
          pi --version
          bwrap --version | head -1

      - name: Generate and post summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSCS_INFERENCE_API_KEY: ${{ secrets.CSCS_INFERENCE_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: ./scripts/post-slack-summary/run.sh
